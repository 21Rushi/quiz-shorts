name: Weekly GK Challenge (long video)

on:
  schedule:
    # Sundays 12:47 UTC = 6:17 PM IST. Rendering takes ~10 min; the video is uploaded as
    # scheduled and YouTube publishes it at exactly 8:47 PM IST (Sunday-evening peak).
    - cron: "47 12 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, don't upload"
        type: boolean
        default: false
      privacy:
        description: "Visibility for a manual upload (use private for tests)"
        type: choice
        options: [public, private, unlisted]
        default: public
      count:
        description: "Number of questions (40 = ~10 min)"
        default: "40"

permissions:
  contents: read

concurrency:
  group: weekly-challenge
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg + Hindi text shaping
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Render and upload weekly challenge
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ inputs.privacy || 'public' }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_COUNT: ${{ inputs.count || '40' }}
        run: |
          ARGS="--count $IN_COUNT"
          if [ "$IN_DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python src/weekly.py $ARGS

      - name: Keep the video as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-${{ github.run_id }}
          path: |
            out/*.mp4
            out/*.jpg
          retention-days: 7
          if-no-files-found: ignore
