name: Weekly GK Challenge (long video)

on:
  schedule:
    # Saturdays 12:47 UTC = 6:17 PM IST. Rendering takes ~10 min; the video is uploaded as
    # scheduled and YouTube publishes it at exactly 8:47 PM IST (Saturday-evening peak).
    - cron: "47 12 * * 6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, don't upload"
        type: boolean
        default: false
      privacy:
        description: "Visibility for a manual upload (use private for tests)"
        type: choice
        options: [public, private, unlisted]
        default: public
      count:
        description: "Number of questions (40 = ~10 min)"
        default: "40"

permissions:
  contents: read

concurrency:
  group: weekly-challenge
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg + Hindi text shaping
        timeout-minutes: 14
        run: |
          # Skip the 'apt-get update' that sometimes hangs: try the runner's existing package lists first.
          if command -v ffmpeg >/dev/null && ldconfig -p | grep -q libraqm; then echo "already installed"; exit 0; fi
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60"
          if sudo timeout 180 apt-get $APT install -y -qq --no-install-recommends ffmpeg libraqm0; then exit 0; fi
          for i in 1 2 3; do
            if sudo timeout 150 apt-get $APT update -qq && \
               sudo timeout 180 apt-get $APT install -y -qq --no-install-recommends ffmpeg libraqm0; then
              exit 0
            fi
            echo "apt try $i failed, retrying..."; sleep 10
          done
          exit 1

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Render and upload weekly challenge
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ inputs.privacy || 'public' }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_COUNT: ${{ inputs.count || '40' }}
        run: |
          ARGS="--count $IN_COUNT"
          if [ "$IN_DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python src/weekly.py $ARGS

      - name: Keep the video as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-${{ github.run_id }}
          path: |
            out/*.mp4
            out/*.jpg
          retention-days: 7
          if-no-files-found: ignore
