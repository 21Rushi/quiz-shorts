name: Weekly GK Challenge (long video)

on:
  schedule:
    # Saturdays 12:47 UTC = 6:17 PM IST. Rendering takes ~10 min; the video is uploaded as
    # scheduled and YouTube publishes it at exactly 8:47 PM IST (Saturday-evening peak).
    - cron: "47 12 * * 6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, don't upload"
        type: boolean
        default: false
      privacy:
        description: "Visibility for a manual upload (use private for tests)"
        type: choice
        options: [public, private, unlisted]
        default: public
      count:
        description: "Number of questions (40 = ~10 min)"
        default: "40"

permissions:
  contents: read

concurrency:
  group: weekly-challenge
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      # The Ubuntu apt mirror sometimes hangs for 15+ min (18-19 Nov) and killed runs. So apt is no longer
      # required: Pillow's wheel already has Hindi shaping (raqm) built in, and ffmpeg falls back to a static
      # build downloaded from GitHub itself. apt is only a quick first try (90 s cap, no 'apt-get update').
      - name: Install ffmpeg + Hindi text shaping
        timeout-minutes: 10
        run: |
          raqm() { python -c "from PIL import features; import sys; sys.exit(0 if features.check('raqm') else 1)"; }
          if ! command -v ffmpeg >/dev/null || ! raqm; then
            sudo timeout 90 apt-get -o DPkg::Lock::Timeout=30 -o Acquire::http::Timeout=15 install -y -qq \
              --no-install-recommends ffmpeg libraqm0 libfribidi0 || echo "apt unavailable, using fallbacks"
          fi
          if ! command -v ffmpeg >/dev/null; then
            for i in 1 2 3; do
              if curl -fsSL --retry 3 --max-time 180 -o /tmp/ff.tar.xz \
                   https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz; then
                mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1 && \
                sudo cp /tmp/ff/bin/ffmpeg /tmp/ff/bin/ffprobe /usr/local/bin/ && break
              fi
              echo "ffmpeg download try $i failed"; sleep 10
            done
          fi
          ffmpeg -version | head -1
          if ! raqm; then
            sudo timeout 240 apt-get -o Acquire::http::Timeout=20 update -qq || true
            sudo timeout 180 apt-get install -y -qq --no-install-recommends libraqm0 libfribidi0 || true
          fi

      - name: Check Hindi shaping is available
        run: python -c "from PIL import features; assert features.check('raqm'), 'libraqm missing - Hindi would render broken'"

      - name: Render and upload weekly challenge
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ inputs.privacy || 'public' }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_COUNT: ${{ inputs.count || '40' }}
        run: |
          ARGS="--count $IN_COUNT"
          if [ "$IN_DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python src/weekly.py $ARGS

      - name: Keep the video as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-${{ github.run_id }}
          path: |
            out/*.mp4
            out/*.jpg
          retention-days: 7
          if-no-files-found: ignore
