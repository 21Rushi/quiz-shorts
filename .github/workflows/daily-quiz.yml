name: Daily Shorts (quiz + pre-made story/facts)

on:
  schedule:
    # Runs ~1 hour early (UTC): 01:17 UTC = 6:47 AM IST, 13:17 UTC = 6:47 PM IST.
    # The video is uploaded as scheduled and YouTube publishes it at exactly
    # 7:47 AM / 7:47 PM IST, so GitHub's usual 5-30 min scheduler delay doesn't matter.
    - cron: "17 1 * * *"
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Which slot to post"
        type: choice
        options: [morning, evening]
        default: morning
      date:
        description: "Post the quiz planned for this date (YYYY-MM-DD). Empty = today"
        required: false
      dry_run:
        description: "Render only, don't upload"
        type: boolean
        default: false
      privacy:
        description: "Visibility for a manual upload (use private for tests)"
        type: choice
        options: [public, private, unlisted]
        default: public

# Least privilege: the job only needs to read the code.
permissions:
  contents: read
  actions: write   # needed to save the small 'already posted' cache marker

concurrency:
  group: daily-quiz
  cancel-in-progress: false

jobs:
  quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg + Hindi text shaping
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Check Hindi shaping is available
        run: python -c "from PIL import features; assert features.check('raqm'), 'libraqm missing - Hindi would render broken'"

      - name: Work out date and slot (IST)
        id: when
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          IN_SLOT: ${{ inputs.slot }}
          IN_DATE: ${{ inputs.date }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            if [ "$CRON" = "17 1 * * *" ]; then SLOT=morning; else SLOT=evening; fi
          else SLOT="$IN_SLOT"; fi
          DATE="${IN_DATE:-$(TZ=Asia/Kolkata date +%F)}"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"; echo "date=$DATE" >> "$GITHUB_OUTPUT"

      # Skip if this date+slot was already posted publicly (e.g. a manual re-run beat a late schedule).
      - name: Check if already posted
        id: posted
        uses: actions/cache/restore@v4
        with:
          path: .posted
          key: posted-${{ steps.when.outputs.date }}-${{ steps.when.outputs.slot }}
          lookup-only: true

      # Pre-made Shorts (Google Flow stories / Facts) are pushed to the `premade`
      # branch by Claude. If one exists for this date+slot it is posted instead of the quiz.
      - name: Fetch pre-made videos
        if: steps.posted.outputs.cache-hit != 'true'
        run: |
          if git fetch --depth 1 origin premade 2>/dev/null; then
            git worktree add --detach premade FETCH_HEAD
            ls -R premade | head -20
          else
            echo "No premade branch yet"
          fi

      - name: Render and upload
        if: steps.posted.outputs.cache-hit != 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          IN_SLOT: ${{ inputs.slot }}
          IN_DATE: ${{ inputs.date }}
          IN_DRY: ${{ inputs.dry_run }}
          YT_PRIVACY: ${{ inputs.privacy || 'public' }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            if [ "$CRON" = "17 1 * * *" ]; then SLOT=morning; else SLOT=evening; fi
            ARGS="--slot $SLOT"
          else
            ARGS="--slot $IN_SLOT"
            if [ -n "$IN_DATE" ]; then ARGS="$ARGS --date $IN_DATE"; fi
            if [ "$IN_DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          fi
          set +e
          python src/post_premade.py $ARGS --dir premade
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then exit 0; fi
          if [ "$rc" -ne 3 ]; then exit "$rc"; fi
          python src/daily.py $ARGS

      - name: Remember this slot is posted
        if: success() && steps.posted.outputs.cache-hit != 'true' && inputs.dry_run != true && (inputs.privacy || 'public') == 'public'
        run: mkdir -p .posted && echo ok > .posted/done

      - name: Save posted marker
        if: success() && steps.posted.outputs.cache-hit != 'true' && inputs.dry_run != true && (inputs.privacy || 'public') == 'public'
        uses: actions/cache/save@v4
        with:
          path: .posted
          key: posted-${{ steps.when.outputs.date }}-${{ steps.when.outputs.slot }}

      - name: Keep the video as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-video-${{ github.run_id }}
          path: out/*.mp4
          retention-days: 7
          if-no-files-found: ignore
