name: Daily Shorts (quiz + pre-made story/facts)

on:
  schedule:
    # Each run is ~1 hour early (UTC). The video is uploaded as scheduled and YouTube
    # publishes it at the exact IST time, so GitHub's usual 5-30 min delay doesn't matter.
    - cron: "17 1 * * *"    # 6:47 AM IST  -> morning quiz, public 7:47 AM
    - cron: "17 7 * * *"    # 12:47 PM IST -> evening quiz, public 1:47 PM
    - cron: "17 13 * * *"   # 6:47 PM IST  -> pre-made Facts/Flow Short (if any), public 7:47 PM
    # Backups 25 min later, in case GitHub skips a scheduled run. The "already posted"
    # marker below makes a backup do nothing when the main run already posted.
    - cron: "42 1 * * *"    # backup morning quiz
    - cron: "42 7 * * *"    # backup evening quiz
    - cron: "42 13 * * *"   # backup pre-made Short
  workflow_dispatch:
    inputs:
      slot:
        description: "morning / evening = quiz, premade = Facts/Flow video from the premade branch"
        type: choice
        options: [morning, evening, premade]
        default: morning
      date:
        description: "Post the item planned for this date (YYYY-MM-DD). Empty = today"
        required: false
      dry_run:
        description: "Render only, don't upload"
        type: boolean
        default: false
      privacy:
        description: "Visibility for a manual upload (use private for tests)"
        type: choice
        options: [public, private, unlisted]
        default: public

# Least privilege: the job only needs to read the code.
permissions:
  contents: read
  actions: write   # needed to save the small 'already posted' cache marker

concurrency:
  group: daily-quiz
  cancel-in-progress: false

jobs:
  quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg + Hindi text shaping
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Check Hindi shaping is available
        run: python -c "from PIL import features; assert features.check('raqm'), 'libraqm missing - Hindi would render broken'"

      - name: Work out date and slot (IST)
        id: when
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          IN_SLOT: ${{ inputs.slot }}
          IN_DATE: ${{ inputs.date }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            case "$CRON" in
              "17 1 * * *"|"42 1 * * *") SLOT=morning ;;
              "17 7 * * *"|"42 7 * * *") SLOT=evening ;;
              *) SLOT=premade ;;
            esac
          else SLOT="$IN_SLOT"; fi
          # Scheduled runs: take the IST date 6 hours ago, so a run GitHub delays past
          # midnight still posts for the day it was meant for.
          if [ "$EVENT" = "schedule" ]; then DATE=$(TZ=Asia/Kolkata date -d '-6 hours' +%F)
          else DATE="${IN_DATE:-$(TZ=Asia/Kolkata date +%F)}"; fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"; echo "date=$DATE" >> "$GITHUB_OUTPUT"

      # Skip if this date+slot was already posted publicly (e.g. a manual re-run beat a late schedule).
      - name: Check if already posted
        id: posted
        uses: actions/cache/restore@v4
        with:
          path: .posted
          key: posted-${{ steps.when.outputs.date }}-${{ steps.when.outputs.slot }}
          lookup-only: true

      # Pre-made Shorts (Google Flow stories / Facts) are pushed to the `premade`
      # branch by Claude and post in their own 7:47 PM slot (both quizzes still post).
      - name: Fetch pre-made videos
        if: steps.posted.outputs.cache-hit != 'true' && steps.when.outputs.slot == 'premade'
        run: |
          if git fetch --depth 1 origin premade 2>/dev/null; then
            git worktree add --detach premade FETCH_HEAD
            ls -R premade | head -20
          else
            echo "No premade branch yet"
          fi

      # No pre-made video pushed? Build today's Facts / 1-min story Short from
      # studio/auto_shorts.json right here (no Claude run, no laptop needed).
      - name: Build planned Short (Facts / story)
        if: steps.posted.outputs.cache-hit != 'true' && steps.when.outputs.slot == 'premade'
        run: |
          mkdir -p ~/fonts && cd ~/fonts
          npm pack -s @expo-google-fonts/noto-sans-devanagari @expo-google-fonts/montserrat >/dev/null
          for f in *.tgz; do tar xzf "$f"; done
          cd "$GITHUB_WORKSPACE"
          python src/build_auto.py --date "${{ steps.when.outputs.date }}" --dir premade

      - name: Render and upload
        id: post
        if: steps.posted.outputs.cache-hit != 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SLOT: ${{ steps.when.outputs.slot }}
          DATE: ${{ steps.when.outputs.date }}
          IN_DRY: ${{ inputs.dry_run }}
          YT_PRIVACY: ${{ inputs.privacy || 'public' }}
        run: |
          DRY=""
          if [ "$IN_DRY" = "true" ]; then DRY="--dry-run"; fi
          if [ "$SLOT" = "premade" ]; then
            set +e
            python src/post_premade.py --slot evening --date "$DATE" --dir premade $DRY
            rc=$?
            set -e
            if [ "$rc" -eq 3 ]; then echo "posted=no" >> "$GITHUB_OUTPUT"; exit 0; fi
            exit "$rc"
          fi
          python src/daily.py --slot "$SLOT" --date "$DATE" $DRY

      - name: Remember this slot is posted
        if: success() && steps.posted.outputs.cache-hit != 'true' && steps.post.outputs.posted != 'no' && inputs.dry_run != true && (inputs.privacy || 'public') == 'public'
        run: mkdir -p .posted && echo ok > .posted/done

      - name: Save posted marker
        if: success() && steps.posted.outputs.cache-hit != 'true' && steps.post.outputs.posted != 'no' && inputs.dry_run != true && (inputs.privacy || 'public') == 'public'
        uses: actions/cache/save@v4
        with:
          path: .posted
          key: posted-${{ steps.when.outputs.date }}-${{ steps.when.outputs.slot }}

      - name: Keep the video as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-video-${{ github.run_id }}
          path: out/*.mp4
          retention-days: 7
          if-no-files-found: ignore
