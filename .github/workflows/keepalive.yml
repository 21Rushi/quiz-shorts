name: Keep schedules alive

# GitHub turns off scheduled workflows in public repos after 60 days without
# commits. This makes one tiny commit a month so the daily uploads never stop.
on:
  schedule:
    - cron: "23 3 1 * *"   # 1st of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive: $(date -u +%Y-%m)" && git push
